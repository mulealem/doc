# Serves the static Next.js export (doc/out/) built by the Dockerfile.
# Listens on 8080 to match docker-compose.yml; Coolify terminates TLS.
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
