name: pygate-docs

services:
  docs:
    build: .
    container_name: pygate-docs
    restart: unless-stopped
    ports:
      - "3003:8080"
    environment:
      - NEXT_PUBLIC_DASHBOARD_URL=https://dashboard.example.com
      - NEXT_PUBLIC_CHECKOUT_URL=https://checkout.example.com
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
